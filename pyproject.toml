[project]
name = "darkmatter"
version = "0.1.0"
description = "Structure- and novelty-aware detection of uncharacterized microbial sequence function"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.33",
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
    "biopython>=1.84",
    "pandas>=2.2",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "requests>=2.32",
    "boto3>=1.43.67",
    "pyhmmer>=0.12.1",
    "scipy>=1.17.1",
    "matplotlib>=3.11.1",
    "sentencepiece>=0.2.2",
    "tiktoken>=0.14.0",
    "protobuf>=7.36.1",
    "pyrodigal>=3.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darkmatter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
